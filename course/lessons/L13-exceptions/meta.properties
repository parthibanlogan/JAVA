browserNote=Known browser difference: the JavaScript produced by TeaVM does not check array indices or integer division by zero, so the last two checks behave differently in the browser (no exception; 5 / 0 gives 0). On the JVM, used in the lab and in exams, both throw exceptions exactly as the expected output shows.
