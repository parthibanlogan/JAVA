plugins {
    id 'com.android.application'
}

android {
    namespace 'lab.civiltech.android'
    compileSdk 35

    defaultConfig {
        applicationId 'lab.civiltech.android'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    sourceSets {
        main {
            // The SAME Java files that run on the JVM and (via TeaVM) in the browser.
            java.srcDirs += ['../../java/civiltech-core/src/main/java']
            // The SAME open datasets that the website uses.
            assets.srcDirs += ['../../site/data/catchment']
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}
