name: Project submission (add my app to the lab website)
description: Submit your finished or in-progress app to the project directory
title: "[Submission] "
labels: ["submission"]
body:
  - type: markdown
    attributes:
      value: |
        Fill the **Submit a project** form on the lab website: it creates the directory entry for you
        and opens this page with everything filled in. An automatic check replies in a few minutes.
  - type: input
    id: problem_id
    attributes:
      label: Problem ID
      placeholder: P013 or OWN
    validations:
      required: true
  - type: input
    id: repository
    attributes:
      label: Repository URL
      placeholder: https://github.com/user-one/rainwater-harvesting
    validations:
      required: true
  - type: input
    id: demo
    attributes:
      label: Live demo URL (GitHub Pages)
      placeholder: https://user-one.github.io/rainwater-harvesting/
  - type: textarea
    id: entry
    attributes:
      label: Directory entry (JSON)
      description: Generated by the Submit a project page. Do not edit by hand unless you know JSON.
      render: json
    validations:
      required: true
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: The repository is public and has a licence file.
          required: true
        - label: The README lists every dataset with its source and licence.
          required: true
        - label: The Java module has at least one test that reproduces a hand calculation.
          required: true
        - label: Every team member can explain the code.
          required: true
