name: Deploy website to GitHub Pages

# Enable once: repository Settings -> Pages -> Build and deployment -> Source: GitHub Actions
on:
  push:
    branches: [main]
    paths-ignore: ['lab/control.json']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
      - working-directory: android-app
        run: ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v6
        with:
          name: apk
          path: android-app/app/build/outputs/apk/debug/app-debug.apk

  build:
    needs: android
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            25
            21
          cache: maven
      - name: Build the lab's class-library additions
        run: mvn -B -q -f java/pom.xml install -DskipTests
      - name: Cache the in-browser Java compiler
        id: cache
        uses: actions/cache@v5
        with:
          path: javac-dist
          key: browser-javac-${{ hashFiles('tools/browser-javac/build.sh', 'java/teavm-patches/src/**') }}
      - name: Build the in-browser Java compiler (only when its inputs changed)
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          JAVA25_HOME: ${{ env.JAVA_HOME_25_X64 }}
        run: bash tools/browser-javac/build.sh javac-dist
      - name: Build site
        env:
          JAVAC_DIST: javac-dist
        run: bash tools/build-site.sh build/site
      - uses: actions/download-artifact@v7
        with:
          name: apk
          path: build/site/downloads
      - name: Name the APK
        run: mv build/site/downloads/app-debug.apk build/site/downloads/civiltech-catchment-debug.apk
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: build/site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
